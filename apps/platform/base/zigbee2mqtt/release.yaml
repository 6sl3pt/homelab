apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
  namespace: zigbee2mqtt
spec:
  interval: 30m
  chart:
    spec:
      chart: zigbee2mqtt
      version: 2.13.0
      sourceRef:
        kind: HelmRepository
        name: zigbee2mqtt
        namespace: zigbee2mqtt

  valuesFrom:
    - kind: ConfigMap
      name: zigbee2mqtt-values
    - kind: Secret
      name: zigbee2mqtt-container-env
      valuesKey: MQTT_USER
      targetPath: zigbee2mqtt.mqtt.user
    - kind: Secret
      name: zigbee2mqtt-container-env
      valuesKey: MQTT_PASSWORD
      targetPath: zigbee2mqtt.mqtt.password
