apiVersion: v1
kind: ConfigMap
metadata:
  name: rackula-ui-config
  namespace: rackula
data:
  API_HOST: '127.0.0.1'
  API_PORT: '3001'
  RACKULA_LISTEN_PORT: '8080'
  RACKULA_AUTH_MODE: 'oidc'
  RACKULA_BASE_URL: 'https://rackula.apps.6541333.xyz'
  RACKULA_TRUST_PROXY: '1'
  RACKULA_STORAGE_MODE: 'server'
