apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rackula
  namespace: rackula
spec:
  parentRefs:
    - name: apps-gateway
      namespace: cilium-gateway
      sectionName: rackula
  hostnames:
    - rackula.apps.6541333.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
              - name: X-Forwarded-Host
                value: rackula.apps.6541333.xyz
      backendRefs:
        - name: rackula-ui
          port: 8080
